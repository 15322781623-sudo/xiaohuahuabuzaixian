  <!-- ===== -1. 恢复原始 fetch/XHR (绕过 CapacitorHttp 全局拦截) ===== -->
  <script>
  (function() {
    // CapacitorHttp.enabled: true 会 patch window.fetch/XMLHttpRequest
    // 原始版本保存在 window.CapacitorWebFetch / window.CapacitorWebXMLHttpRequest
    // 游戏 iframe 不需要走拦截器，恢复原始版本避免请求被改写
    try {
      if (window.CapacitorWebFetch) {
        window.fetch = window.CapacitorWebFetch;
      }
      if (window.CapacitorWebXMLHttpRequest) {
        var orig = window.CapacitorWebXMLHttpRequest;
        if (orig.fullObject) {
          window.XMLHttpRequest = orig.fullObject;
        } else {
          var proto = XMLHttpRequest.prototype;
          if (orig.open) proto.open = orig.open;
          if (orig.send) proto.send = orig.send;
          if (orig.abort) proto.abort = orig.abort;
          if (orig.setRequestHeader) proto.setRequestHeader = orig.setRequestHeader;
          if (orig.getResponseHeader) proto.getResponseHeader = orig.getResponseHeader;
          if (orig.getAllResponseHeaders) proto.getAllResponseHeaders = orig.getAllResponseHeaders;
        }
      }
    } catch(e) {}
  })();
  </script>

  <!-- ===== 0. 登录数据初始化 (必须在所有其他脚本之前) ===== -->
  <script>
  (function() {
    var TAG = '[GameLogin]';
    var loginData = null;
    var LOGIN_KEY = '__game_login_data__';

    // ★ 0. 优先从 URL 参数读取 tokenId (批量登录模式)
    try {
      var urlParams = new URLSearchParams(window.location.search);
      var tokenId = urlParams.get('token');
      if (tokenId) {
        var tokenKey = '__game_login_' + tokenId + '__';
        var raw0 = localStorage.getItem(tokenKey);
        if (raw0) {
          loginData = JSON.parse(raw0);
          console.log(TAG, '✅ 从 URL token 参数读取登录数据成功, tokenId=' + tokenId);
          localStorage.removeItem(tokenKey);
        }
      }
    } catch(e) { console.warn(TAG, 'URL token读取失败:', e.message); }

    // ★ 1. 回退: 从 localStorage 通用 key 读取 (单账号登录, 跨标签页共享)
    if (!loginData) {
      try {
        var raw = localStorage.getItem(LOGIN_KEY);
        if (raw) {
          loginData = JSON.parse(raw);
          console.log(TAG, '✅ 从 localStorage 读取登录数据成功');
          localStorage.removeItem(LOGIN_KEY);
        }
      } catch(e) { console.warn(TAG, 'localStorage读取失败:', e.message); }
    }

    // 回退2: 从 opener 的 sessionStorage 读取 (兼容旧逻辑)
    if (!loginData) {
      try {
        if (window.opener && window.opener.sessionStorage) {
          var raw2 = window.opener.sessionStorage.getItem(LOGIN_KEY);
          if (raw2) {
            loginData = JSON.parse(raw2);
            console.log(TAG, '从 opener sessionStorage 读取成功');
            window.opener.sessionStorage.removeItem(LOGIN_KEY);
          }
        }
      } catch(e) { console.warn(TAG, 'opener读取失败:', e.message); }
    }

    // 回退2: 从自身 sessionStorage 读取
    if (!loginData) {
      try { loginData = JSON.parse(sessionStorage.getItem(LOGIN_KEY)); } catch(e) {}
    }

    // 回退3: 从 123项目格式的 localStorage 读取
    if (!loginData) {
      try {
        var pending = localStorage.getItem('_pending_login_data_');
        if (pending) {
          var pd = JSON.parse(pending);
          if (pd.account) {
            loginData = {
              info: pd.account.info || '',
              platform: pd.account.platform || 'hortor',
              platformExt: pd.account.platformExt || 'mix',
              serverId: pd.account.serverId || '0'
            };
            console.log(TAG, '从 _pending_login_data_ 读取成功');
          }
        }
      } catch(e) {}
    }

    if (!loginData) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:18px;background:#333;">登录数据不存在，请从助手页面跳转进入游戏</div>';
      return;
    }

    // ★ 设置全局登录数据 (供 1.js hook 读取)
    // 匹配123项目的 __saveInfoData 格式
    window.__saveInfoData = loginData;
    window.__saveData = null;
    // tokenId 从 URL 参数获取，可能未定义
    window._gameTokenId = (typeof tokenId !== 'undefined' ? tokenId : '') || ''; // 不需要原始BIN字节，直接用解码后的数据
    console.log(TAG, '登录数据已注入:',
      'platform=' + loginData.platform,
      'platformExt=' + loginData.platformExt,
      'serverId=' + loginData.serverId,
      'infoLen=' + (loginData.info ? loginData.info.length : 0));

    // ★ 同步模块: UI事件转发 + 回放
    window._syncEnabled = false;
    window._syncReplay = false;

    // ★ 拦截 Canvas 事件监听器注册（必须在 Cocos2d 引擎加载前执行）
    // 当 Cocos2d 注册 touch/pointer/mouse 监听时，保存其回调引用
    var _cocosHandlers = {};
    (function() {
      var _origAdd = HTMLCanvasElement.prototype.addEventListener;
      HTMLCanvasElement.prototype.addEventListener = function(type, fn, opts) {
        if (this.id === 'GameCanvas' || this.tagName === 'CANVAS') {
          var capture = (opts === true || (opts && opts.capture));
          var key = type + (capture ? ':capture' : '');
          if (!_cocosHandlers[key]) _cocosHandlers[key] = [];
          _cocosHandlers[key].push(fn);
        }
        return _origAdd.call(this, type, fn, opts);
      };
    })();

    // ★ 通过保存的回调直接注入事件（完全绕过 isTrusted 检查）
    function injectViaHandlers(type, cx, cy, extra) {
      extra = extra || {};
      // 构造与真实事件结构一致的假事件对象
      var fakeEv = {
        type: type,
        clientX: cx, clientY: cy, pageX: cx, pageY: cy,
        screenX: cx, screenY: cy,
        offsetX: cx, offsetY: cy,
        button: 0, buttons: type.indexOf('up') >= 0 ? 0 : 1, which: 1,
        pointerId: extra.pointerId || 1,
        pointerType: extra.pointerType || 'mouse',
        isPrimary: true,
        width: extra.width || 1, height: extra.height || 1,
        pressure: extra.pressure != null ? extra.pressure : 0.5,
        deltaX: extra.deltaX || 0, deltaY: extra.deltaY || 0,
        deltaZ: extra.deltaZ || 0, deltaMode: extra.deltaMode || 0,
        target: document.getElementById('GameCanvas'),
        currentTarget: document.getElementById('GameCanvas'),
        preventDefault: function(){}, stopPropagation: function(){},
        stopImmediatePropagation: function(){},
        ctrlKey: false, shiftKey: false, altKey: false, metaKey: false,
        view: window, bubbles: true, cancelable: true, composed: true,
        isTrusted: true // 伪装为可信事件
      };
      // 触摸事件添加 touches 数组
      if (type.indexOf('touch') >= 0) {
        var t = { identifier: 0, clientX: cx, clientY: cy, pageX: cx, pageY: cy, screenX: cx, screenY: cy, target: fakeEv.target, radiusX: 1, radiusY: 1, rotationAngle: 0, force: 1 };
        if (type === 'touchend') {
          fakeEv.changedTouches = [t];
        } else {
          fakeEv.touches = [t]; fakeEv.targetTouches = [t]; fakeEv.changedTouches = [t];
        }
      }

      var fired = false;
      // 查找并调用 Cocos2d 注册的对应回调
      var searchTypes = [type];
      // pointer 事件同时查找对应的 mouse/touch 回调
      if (type === 'pointerdown') searchTypes.push('mousedown', 'touchstart');
      if (type === 'pointermove') searchTypes.push('mousemove', 'touchmove');
      if (type === 'pointerup') searchTypes.push('mouseup', 'touchend');

      for (var i = 0; i < searchTypes.length; i++) {
        var st = searchTypes[i];
        ['false', 'true'].forEach(function(captureKey) {
          var key = st + (captureKey === 'true' ? ':capture' : '');
          var handlers = _cocosHandlers[key];
          if (handlers && handlers.length > 0) {
            for (var j = 0; j < handlers.length; j++) {
              try {
                handlers[j].call(fakeEv.target, fakeEv);
                fired = true;
              } catch(e) {}
            }
          }
        });
      }
      return fired;
    }

    // ★ 监听父窗口的同步指令和事件回放
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      if (e.data.type === 'INPUT_EVENT' && e.data.event) {
        var ev = e.data.event;
        try {
          var canvas = document.getElementById('GameCanvas');
          if (!canvas) return;
          window._syncReplay = true;
          var rect = canvas.getBoundingClientRect();
          // ★ 优先使用 canvas 相对坐标（解决 canvas 不在视口原点时的坐标偏差）
          var cx, cy;
          if (ev.canvasX != null && ev.canvasW) {
            cx = (ev.canvasX / ev.canvasW) * rect.width;
            cy = (ev.canvasY / ev.canvasH) * rect.height;
          } else {
            var scaleX = rect.width / (ev.viewW || rect.width);
            var scaleY = rect.height / (ev.viewH || rect.height);
            cx = ev.clientX * scaleX;
            cy = ev.clientY * scaleY;
          }

          // ★ 传递事件附加属性（wheel delta、pointer 属性等）
          var extra = {
            pointerId: ev.pointerId, pointerType: ev.pointerType,
            width: ev.width, height: ev.height, pressure: ev.pressure,
            deltaX: ev.deltaX, deltaY: ev.deltaY,
            deltaZ: ev.deltaZ, deltaMode: ev.deltaMode
          };

          // ★ 通过拦截的回调直接注入
          var injected = injectViaHandlers(ev.eventType, cx, cy, extra);

          // ★ 回退: dispatchEvent（按事件类型创建对应的原生事件）
          if (!injected) {
            if (ev.eventType === 'wheel') {
              var wheelEv = new WheelEvent('wheel', {
                bubbles: true, cancelable: true, view: window,
                clientX: cx, clientY: cy,
                deltaX: ev.deltaX || 0, deltaY: ev.deltaY || 0,
                deltaZ: ev.deltaZ || 0, deltaMode: ev.deltaMode || 0
              });
              canvas.dispatchEvent(wheelEv);
            } else if (ev.eventType.indexOf('pointer') === 0 && typeof PointerEvent !== 'undefined') {
              var ptrEv = new PointerEvent(ev.eventType, {
                bubbles: true, cancelable: true, view: window,
                clientX: cx, clientY: cy, button: 0,
                pointerId: ev.pointerId || 1,
                pointerType: ev.pointerType || 'mouse',
                isPrimary: true, width: ev.width || 1, height: ev.height || 1,
                pressure: ev.pressure != null ? ev.pressure : 0.5
              });
              canvas.dispatchEvent(ptrEv);
            } else if (ev.eventType.indexOf('touch') >= 0) {
              var touchObj = new Touch({ identifier: 0, target: canvas, clientX: cx, clientY: cy, pageX: cx, pageY: cy });
              var touchInit = { bubbles: true, cancelable: true, view: window };
              if (ev.eventType === 'touchend') {
                touchInit.changedTouches = [touchObj];
              } else {
                touchInit.touches = [touchObj]; touchInit.targetTouches = [touchObj]; touchInit.changedTouches = [touchObj];
              }
              var tEv = new TouchEvent(ev.eventType, touchInit);
              canvas.dispatchEvent(tEv);
            } else {
              var mouseEv = new MouseEvent(
                ev.eventType.replace('pointer','mouse').replace('touch','mouse'),
                { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, button: 0 }
              );
              canvas.dispatchEvent(mouseEv);
            }
          }
          window._syncReplay = false;
        } catch(err) {
          window._syncReplay = false;
          console.warn(TAG, '事件回放失败:', err.message);
        }
      }

      // ★ 脚本注入: 接收父窗口发送的JS脚本并执行
      if (e.data.type === 'INJECT_SCRIPT' && e.data.code) {
        try {
          var fn = new Function(e.data.code);
          fn.call(window);
          console.log('[Script] 已执行:', e.data.name || 'unnamed');
        } catch(err) {
          console.error('[Script] 执行失败:', e.data.name || 'unnamed', err.message);
        }
      }
    });

    // ★ 自注入: 独立窗口打开时自动从 localStorage 读取增强代码并执行
    if (window.parent === window) {
      (function() {
        try {
          var cached = localStorage.getItem('__game_enhance_codes__');
          if (!cached) return;
          var codes = JSON.parse(cached);
          if (!Array.isArray(codes) || codes.length === 0) return;
          console.log('[自注入] 发现 ' + codes.length + ' 项增强代码，等待游戏初始化...');
          setTimeout(function() {
            codes.forEach(function(item) {
              try {
                var fn = new Function(item.code);
                fn.call(window);
                console.log('[自注入] 已执行:', item.name);
              } catch(err) {
                console.error('[自注入] 执行失败:', item.name, err.message);
              }
            });
            console.log('[自注入] 完成，共注入 ' + codes.length + ' 项功能');
          }, 1500);
        } catch(e) {
          console.warn('[自注入] 读取失败:', e.message);
        }
      })();
    }

    // ★ Canvas 事件捕获: 同步开启时将操作转发给父窗口
    (function() {
      var captured = false;
      var lastMoveTime = 0;
      var MOVE_THROTTLE = 32; // 节流，避免过多 postMessage
      // ★ 触摸去重: 移动端一次交互同时产生 touch+pointer+mouse 事件
      // 记录 touch 时间戳，抑制后续冗余的 pointer/mouse 事件
      var lastTouchTime = 0;
      var TOUCH_DEDUP_MS = 100;

      var forwardEvent = function(type, e) {
        // ★ 支持 iframe 模式和独立窗口模式（通过 opener 转发）
        var isIframe = window.parent !== window;
        var hasOpener = !isIframe && window.opener && !window.opener.closed;
        if (window._syncReplay || !window._syncEnabled || (!isIframe && !hasOpener)) return;

        // ★ 去重: 防止同一次交互的多种事件类型都被转发导致目标窗口抖动
        var now = Date.now();
        if (type.indexOf('touch') === 0) {
          lastTouchTime = now;
        } else if (type.indexOf('pointer') === 0 || type.indexOf('mouse') === 0) {
          // pointer/mouse 事件: 如果近期有 touch 事件，说明 touch 已处理，跳过
          if (now - lastTouchTime < TOUCH_DEDUP_MS) return;
        }

        // 移动/滚轮事件节流
        if (type === 'mousemove' || type === 'pointermove' || type === 'touchmove' || type === 'wheel') {
          if (now - lastMoveTime < MOVE_THROTTLE) return;
          lastMoveTime = now;
        }

        try {
          var canvas = document.getElementById('GameCanvas');
          var rect = canvas ? canvas.getBoundingClientRect() : null;
          var data = {
            eventType: type,
            clientX: e.clientX || 0,
            clientY: e.clientY || 0,
            button: e.button || 0,
            viewW: window.innerWidth,
            viewH: window.innerHeight,
            // ★ canvas 相对坐标（解决 canvas 不在视口原点时的坐标偏差）
            canvasX: rect ? (e.clientX || 0) - rect.left : 0,
            canvasY: rect ? (e.clientY || 0) - rect.top : 0,
            canvasW: rect ? rect.width : 1,
            canvasH: rect ? rect.height : 1
          };
          // PointerEvent 特有属性
          if (type.indexOf('pointer') === 0) {
            data.pointerId = e.pointerId || 1;
            data.pointerType = e.pointerType || 'mouse';
            data.width = e.width || 1;
            data.height = e.height || 1;
            data.pressure = e.pressure || 0.5;
          }
          // WheelEvent 特有属性
          if (type === 'wheel') {
            data.deltaX = e.deltaX || 0;
            data.deltaY = e.deltaY || 0;
            data.deltaZ = e.deltaZ || 0;
            data.deltaMode = e.deltaMode || 0;
          }
          var syncTarget = isIframe ? window.parent : window.opener;
          syncTarget.postMessage({
            type: 'GAME_INPUT_EVENT',
            tokenId: window._gameTokenId || '',
            event: data
          }, '*');
        } catch(err) {}
      };

      function setupCapture() {
        if (captured) return;
        var canvas = document.getElementById('GameCanvas');
        if (!canvas) return;
        captured = true;

        // ★ PointerEvent (Cocos2d 现代版本主要使用)
        canvas.addEventListener('pointerdown', function(e) { forwardEvent('pointerdown', e); }, true);
        canvas.addEventListener('pointerup', function(e) { forwardEvent('pointerup', e); }, true);
        canvas.addEventListener('pointermove', function(e) { forwardEvent('pointermove', e); }, true);
        canvas.addEventListener('pointercancel', function(e) { forwardEvent('pointercancel', e); }, true);

        // 触摸事件 (移动端游戏)
        canvas.addEventListener('touchstart', function(e) { forwardEvent('touchstart', e.touches[0] || e); }, true);
        canvas.addEventListener('touchend', function(e) { forwardEvent('touchend', e.changedTouches[0] || e); }, true);
        canvas.addEventListener('touchmove', function(e) { forwardEvent('touchmove', e.touches[0] || e); }, true);

        // 鼠标事件 (桌面端兼容)
        canvas.addEventListener('mousedown', function(e) { forwardEvent('mousedown', e); }, true);
        canvas.addEventListener('mouseup', function(e) { forwardEvent('mouseup', e); }, true);
        canvas.addEventListener('mousemove', function(e) { forwardEvent('mousemove', e); }, true);

        // ★ 滚轮事件（列表滑动等场景）
        canvas.addEventListener('wheel', function(e) { forwardEvent('wheel', e); }, true);

        console.log(TAG, '✅ Canvas事件捕获已安装 (pointer+touch+mouse+wheel)');
      }

      // 等待Canvas加载
      if (document.getElementById('GameCanvas')) {
        setupCapture();
      } else {
        var observer = new MutationObserver(function() {
          if (document.getElementById('GameCanvas')) {
            setupCapture();
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  })();
  </script>

  <!-- ===== 1. SDK Mock (wx + HSDK) ===== -->
  <script>
  (function() {
    // ★ 检测是否需要在蟠桃园等特殊活动中使用微信小程序环境
    function isPanTaoOrWeChatMini() {
      // 从 URL 参数或全局配置中获取平台信息
      try {
        var urlParams = new URLSearchParams(window.location.search);
        var platformExt = urlParams.get('platformExt');
        var platform = urlParams.get('platform');
        
        // 检查是否为微信小程序环境
        if (platformExt === 'wx_mini_1' || 
            platformExt === 'wxmini' || 
            platform === 'wechat' ||
            window.location.host.includes('servicewechat.com')) {
          return true;
        }
      } catch(e) {}
      return false;
    }
    
    var isWeChatMini = isPanTaoOrWeChatMini();
    console.log('[SDK Mock]', '微信小程序环境:', isWeChatMini);
    
    window.wx = window.wx || {
      getSystemInfo: function() { 
        if (isWeChatMini) {
          // ★ 微信小程序潘桃园专用 UA
          return {
            system: 'iOS',
            platform: 'wechat',
            model: 'iPhone 13 Pro',
            screenWidth: 390,
            screenHeight: 844,
            pixelRatio: 3,
            SDKVersion: '3.3.0',
            language: 'zh_CN',
            version: '8.0.3',
            systemVersion: '15.6',
            brand: 'iPhone',
            wechatVersion: '8.0.3',
            devicePixelRatio: 3
          };
        } else {
          // ★ 通用 Android 环境
          return { platform: 'android', brand: 'Android', system: 'Android 12', model: 'Android' }; 
        }
      },
      getStorageInfo: function() { return { keys: [] }; },
      onShow: function(cb) { if (cb) setTimeout(function() { cb({ scene: '1001', query: {} }); }, 50); },
      onHide: function() {},
      login: function(opts) { if (opts && opts.success) setTimeout(function() { opts.success({ code: 'wx_mock_' + Date.now() }); }, 100); },
      request: function(opts) { if (opts && opts.success) setTimeout(function() { opts.success({ data: '{}' }); }, 50); },
      shareAppMessage: function(opts) { if (opts && opts.success) setTimeout(function() { opts.success(); }, 50); },
      showShareMenu: function(opts) { if (opts && opts.success) opts.success(); },
      hideShareMenu: function(opts) { if (opts && opts.success) opts.success(); },
      getClipboardData: function(opts) { if (opts && opts.success) opts.success({ data: '' }); },
      setClipboardData: function(opts) {
        if (opts && opts.data && navigator.clipboard) { navigator.clipboard.writeText(opts.data).catch(function(){}); }
        if (opts && opts.success) setTimeout(function() { opts.success(); }, 50);
      },
      showModal: function(opts) { if (opts && opts.success) opts.success({ confirm: true }); },
      showToast: function(opts) { if (opts && opts.success) opts.success(); },
      showLoading: function(opts) { if (opts && opts.success) opts.success(); },
      hideLoading: function(opts) { if (opts && opts.success) opts.success(); },
      vibrateShort: function(opts) { if (opts && opts.success) opts.success(); },
      getSetting: function(opts) { if (opts && opts.success) opts.success({ authSetting: {} }); },
      authorize: function(opts) { if (opts && opts.success) opts.success(); },
      previewImage: function() {},
      getImageInfo: function(opts) { if (opts && opts.success) opts.success({ width: 100, height: 100, path: opts.src || '' }); },
      downloadFile: function(opts) { if (opts && opts.success) setTimeout(function() { opts.success({ tempFilePath: opts.url || '' }); }, 100); },
      uploadFile: function(opts) { if (opts && opts.success) setTimeout(function() { opts.success({ data: '{}' }); }, 100); },
      saveImageToPhotosAlbum: function() {},
      createInnerAudioContext: function() { return { play:function(){}, pause:function(){}, stop:function(){}, destroy:function(){} }; },
      getNetworkType: function(opts) { if (opts && opts.success) opts.success({ networkType: 'wifi' }); },
      onNetworkStatusChange: function() {},
      exitMiniProgram: function() {},
      navigateToMiniProgram: function(opts) { if (opts && opts.success) opts.success(); },
    };
    window.HSDK = window.HSDK || {
      _callbacks: [],
      onLogin: function(data) {
        if (data && typeof data === 'function') window.HSDK._callbacks.push(data);
        else if (data && data.listener) window.HSDK._callbacks.push(data.listener);
        setTimeout(function() {

  <!-- ===== 5.6 Bundle下载器修复: 确保bundle下载走自定义下载器而非Cocos默认 ===== -->
  <!-- ★ 问题: Cocos任务管道将bundle名解析为绝对URL, downloadBundle直接用该绝对URL -->
  <!-- ★ 这导致remote bundle(launcher/main)从本地加载而非CDN -->
  <!-- ★ 解决: 在installRemoteAssetLoader之前注册bundle下载器, 用相对URL+convertAssets -->
  <script>
  (function() {
    var GAME_PREFIX = window.location.origin + '/game/';
    var _origInstall = window.installRemoteAssetLoader;
    window.installRemoteAssetLoader = function() {
      var dl = cc.assetManager.downloader;
      // 保存原始下载器引用
      var _origJsonDl = dl._downloaders['.json'];
      var _origScriptDl = dl._downloaders['.js'];

      // ★ 关键: 先包装 convertAssets, 再调用 installRemoteAssetLoader
      // installRemoteAssetLoader 内部的 toRemoteUrl 闭包会捕获包装后的 convertAssets
      var _origConvert = window.convertAssets;
      window.convertAssets = function(url) {
        var result = _origConvert(url);
        if (result === url && typeof url === 'string' &&
            !url.startsWith('http') && !url.startsWith('//') &&
            !url.startsWith('/') && !url.startsWith('.')) {
          return GAME_PREFIX + url;
        }
        return result;
      };

      // 调用原始 installRemoteAssetLoader (toRemoteUrl 将使用包装后的 convertAssets)
      _origInstall();

      // ★ 在installRemoteAssetLoader之后覆盖bundle下载器
      // 始终用相对URL, 让toRemoteUrl/convertAssets正确处理
      dl._downloaders['bundle'] = function(url, options, onComplete) {
        var bundleName = cc.path.basename(url);
        var base = 'assets/' + bundleName;
        var version = options.version || (dl.bundleVers && dl.bundleVers[bundleName]);
        if (!version && bundleName !== cc.AssetManager.BuiltinBundleName.INTERNAL) {
          onComplete && onComplete(new Error('[BundleFix] missing version: ' + bundleName));
          return;
        }
        var versionPart = version ? version + '.' : '';
        var configUrl = base + '/config.' + versionPart + 'json';
        var indexUrl = base + '/index.' + versionPart + 'js';
        console.log('[BundleFix]', bundleName, '→ config:', configUrl, 'index:', indexUrl);

        var finished = 0, error = null, config = null;
        function done(err) {
          if (err) error = err;
          finished++;
          if (finished === 2) onComplete && onComplete(error, config);
        }
        _origJsonDl(window.convertAssets(configUrl), options, function(err, data) {
          if (err) error = err;
          if (data) {
            var remoteBase = window.convertAssets(base);
            data.base = remoteBase + '/';
            config = data;
          }
          done(err);
        });
        // ★ index可能为.jsc加密文件, 用dl.download走downloadScript解密链
        var convertedIndexUrl = window.convertAssets(indexUrl);
        dl.download(bundleName + '-index', convertedIndexUrl, '.js', options, done);
      };

      console.log('[BundleFix] 自定义bundle下载器已注册 + convertAssets已包装');
    };
  })();
  </script>

  <!-- ===== 6. 启动逻辑 ===== -->
  <script>
  (function() {
    'use strict';
    var TAG = '[boot]';

    // 尺寸初始化
    document.documentElement.style.width = window.innerWidth + 'px';
    document.documentElement.style.height = window.innerHeight + 'px';
    document.body.style.width = window.innerWidth + 'px';
    document.body.style.height = window.innerHeight + 'px';
    window.addEventListener('resize', function() {
      document.documentElement.style.width = window.innerWidth + 'px';
      document.documentElement.style.height = window.innerHeight + 'px';
      document.body.style.width = window.innerWidth + 'px';
      document.body.style.height = window.innerHeight + 'px';
    });

    // Canvas resize
    window.addEventListener('resize', function() {
      if (typeof cc === 'undefined' || !cc.view) return;
      setTimeout(function() {
        try {
          var w = window.innerWidth, h = window.innerHeight;
          var canvas = document.getElementById('GameCanvas');
          if (canvas) {
            var dpr = window.devicePixelRatio || 1;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            cc.view.setFrameSize(w, h);
          }
          cc.view.resizeWithBrowserSize(true);
        } catch(e) {}
      }, 100);
    });

    // Splash进度
    var splash = document.getElementById('splash');
    var bar = splash && splash.querySelector('.progress-bar span');
    if (bar) bar.style.width = '50%';

    // 启动!
    window.HtmlIsLoaded = true;
    if (typeof cc === 'undefined') {
      console.error(TAG, '❌ cc 未定义，引擎加载失败!');
      if (splash) {
        splash.innerHTML = '<div style="color:#ff6b6b;font-size:14px;text-align:center;padding:20px;">引擎加载失败，请刷新页面重试</div>';
        splash.style.opacity = '1';
        splash.style.display = 'flex';
        splash.style.alignItems = 'center';
        splash.style.justifyContent = 'center';
      }
      return;
    }
    console.log(TAG, '引擎加载成功, 等待 boot()...');
    // boot.js 已覆盖 window.boot() (含manifest获取+CDN资源加载)
    // main.js 也定义了 window.boot() 但 boot.js 后加载, 以 boot.js 为准
    if (typeof window.boot === 'function') {
      console.log(TAG, '调用 boot.js boot() (完整启动流程)...');
      window.boot().catch(function(err) {
        console.error(TAG, 'boot失败:', err.message, err.stack);
        if (splash) {
          splash.innerHTML = '<div style="color:#ff6b6b;font-size:14px;text-align:center;padding:20px;line-height:1.8;">游戏启动失败<br>' + err.message + '<br><br><span style="font-size:12px;color:#999;">请检查网络连接, CDN资源需要可访问</span></div>';
          splash.style.opacity = '1';
          splash.style.display = 'flex';
          splash.style.alignItems = 'center';
          splash.style.justifyContent = 'center';
        }
      });
    } else {
      console.error(TAG, 'window.boot 未定义! boot.js 可能未加载');
    }
  })();
  </script>
